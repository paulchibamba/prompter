name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Prompter declares no permissions at all (docs/SPEC.md §0, requirement P1). This task
      # inspects the *merged* manifest, so a permission pulled in transitively by a dependency
      # is caught too, not just one written directly into app/src/main/AndroidManifest.xml.
      - name: Verify no permissions are declared
        run: ./gradlew verifyNoInternetPermission --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7
