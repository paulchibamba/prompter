name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Prompter declares no permissions at all. This check is the enforcement behind
      # that claim in the README. Step 2 of the build plan replaces it with the
      # verifyNoInternetPermission Gradle task, which inspects the *merged* manifest.
      - name: Verify no permissions are declared
        run: |
          if grep -n 'uses-permission' app/src/main/AndroidManifest.xml; then
            echo "::error::AndroidManifest.xml declares a permission. Prompter must declare none."
            exit 1
          fi
          echo "No permissions declared."

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7
